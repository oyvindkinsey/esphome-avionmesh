name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        run: clang-format --dry-run --Werror $(find components tests -path tests/build -prune -o \( -name '*.cpp' -o -name '*.h' \) -print | grep -vE 'web_(content|script|style)\.h')
      - uses: astral-sh/ruff-action@v3
        with:
          args: check components tools

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: esphome-avionmesh
      - name: Check out avionmesh-cpp (test dependency)
        uses: actions/checkout@v4
        with:
          repository: oyvindkinsey/avionmesh-cpp
          path: avionmesh-cpp
      - name: Configure host tests
        run: cmake -S esphome-avionmesh/tests -B esphome-avionmesh/tests/build
      - name: Build host tests
        run: cmake --build esphome-avionmesh/tests/build -j
      - name: Run host tests
        run: cd esphome-avionmesh/tests/build && ctest --output-on-failure

  esphome-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ESPHome
        # Pin to the version this repo targets; ESPHome >= 2026.8 needs the
        # native ESP-IDF build path (see PR #17 discussion).
        run: pip install "esphome==2026.4.0"
      - name: Provide dummy config and secrets for CI compile
        run: |
          cp examples/avionmesh.example.yaml avionmesh.yaml
          cat > secrets.yaml <<'EOF'
          avionmesh_passphrase: "AQEBAQEBAQEBAQEBAQEBAQ=="
          api_encryption_key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="
          ota_password: "ci-dummy"
          mqtt_username: "ci"
          mqtt_password: "ci"
          EOF
      - name: Compile firmware
        run: esphome compile avionmesh.yaml
